<!-- A page whose script died shows nothing at all, which reads as a broken
     app rather than a broken browser. Everything below reports the failure on
     screen, before the module has had a chance to run. -->
<div id="fatal" class="fatal" hidden></div>
<script>
  window.__booted = false;
  window.__fatal = function (headline, detail) {
    var n = document.getElementById("fatal");
    if (!n || n.dataset.shown) return;
    n.dataset.shown = "1";
    n.hidden = false;
    n.innerHTML = "<b></b><span></span><button type=\"button\">Check this browser</button>";
    n.querySelector("b").textContent = headline;
    n.querySelector("span").textContent = detail || "";
    n.querySelector("button").onclick = function () {
      if (window.selfCheck) return window.selfCheck();
      alert(navigator.userAgent + "\n\nmodules: " + ("noModule" in HTMLScriptElement.prototype) +
            "\nindexedDB: " + !!window.indexedDB + "\ncanvas: " + !!document.createElement("canvas").getContext("2d") +
            "\nMediaRecorder: " + !!window.MediaRecorder);
    };
  };
  addEventListener("error", function (e) {
    window.__fatal("Something in this page failed to load.", (e.message || "script error") + (e.filename ? " (" + e.filename.split("/").pop() + ":" + e.lineno + ")" : ""));
  });
  addEventListener("unhandledrejection", function (e) {
    var r = e.reason; window.__fatal("Something in this page failed.", (r && (r.message || r.detail)) || String(r));
  });
  // Nothing has painted after eight seconds means the module never ran: an old
  // browser, a blocked script, or a half-finished deploy. Say which.
  setTimeout(function () {
    if (window.__booted) return;
    window.__fatal("The tool did not start in this browser.",
      ("noModule" in HTMLScriptElement.prototype)
        ? "The page loaded but its code never ran. Reload once; if it keeps happening, open it in Chrome, Edge or Safari, and check that an extension is not blocking scripts."
        : "This browser is too old to run JavaScript modules. Use a current Chrome, Edge, Firefox or Safari.");
  }, 8000);
</script>
<script nomodule>window.__fatal("This browser cannot run the tool.", "It has no support for JavaScript modules. Use a current Chrome, Edge, Firefox or Safari.");</script>
